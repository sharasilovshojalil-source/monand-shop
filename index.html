<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Monand | Do'kon</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
/* Monand — qora interfeys + logo shaftolisi #FACFAE */
--bg:#0B0908; --card:#16120F; --card-2:#1E1814; --line:#2A221D;
--text:#F5ECE4; --muted:#A3918A; --peach:#FACFAE; --peach-2:#E9AE86; --peach-ink:#1A120D;
--ok:#9CC79F; --err:#FF9C8A;
--serif:'Cormorant Garamond',Georgia,serif;
--r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Jost,system-ui,sans-serif}
body{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:110px}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;color:var(--text)}
.hide{display:none!important}
/* BREND QISMI */
.hero{position:relative;overflow:hidden;padding:34px 18px 26px;text-align:center;
background:radial-gradient(120% 90% at 50% 0%,#2A1E17 0%,#120D0B 55%,var(--bg) 100%);border-bottom:1px solid var(--line)}
.hero .ghost{position:absolute;width:420px;left:50%;top:50%;transform:translate(-50%,-50%);fill:var(--peach);opacity:.05;pointer-events:none}
.hero .mark{width:96px;height:auto;fill:var(--peach);display:block;margin:0 auto 14px;filter:drop-shadow(0 6px 24px rgba(250,207,174,.18))}
.hero .word{width:min(76%,320px);height:auto;fill:var(--peach);display:block;margin:0 auto}
.hero .tagline{margin-top:12px;color:var(--muted);font-size:12px;letter-spacing:3.5px;text-transform:uppercase;font-weight:500}
.bonus-pill{position:absolute;right:14px;top:14px;background:rgba(250,207,174,.08);border:1px solid rgba(250,207,174,.25);color:var(--peach);padding:7px 12px;border-radius:999px;font-weight:600;font-size:13px}
.mode{margin:16px 18px 8px;background:var(--card);border-radius:var(--r);padding:6px;display:grid;grid-template-columns:1fr 1fr;gap:6px;border:1px solid var(--line)}
.mode button{padding:13px 8px;border-radius:16px;font-weight:600;font-size:15px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.mode button.on{background:var(--peach);color:var(--peach-ink)}
.mode-note{margin:2px 22px 6px;font-size:13px;color:var(--muted);font-weight:500}
.mode-note b{color:var(--text);font-weight:600}
/* filial tanlash */
.branch-bar{margin:4px 18px 6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;width:calc(100% - 36px);text-align:left}
.branch-bar.need{border-color:var(--peach);box-shadow:0 0 0 3px rgba(250,207,174,.12)}
.branch-bar .ic{width:38px;height:38px;border-radius:12px;background:rgba(250,207,174,.12);display:grid;place-items:center;flex:0 0 auto}
.branch-bar .t{flex:1;min-width:0}
.branch-bar small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.branch-bar b{font-size:16px;font-weight:600}
.branch-bar .ch{color:var(--peach);font-weight:600;font-size:13px}
.branches{display:grid;gap:10px;margin-top:6px}
.br{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;width:100%}
.br .rad{width:22px;height:22px;border-radius:50%;border:2px solid #4A3C34;flex:0 0 auto;display:grid;place-items:center}
.br.on{border-color:var(--peach);background:#1F1712}
.br.on .rad{border-color:var(--peach)}
.br.on .rad:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--peach)}
.br b{display:block;font-size:18px;font-weight:600}
.br small{color:var(--muted);font-size:13px}
/* bannerlar */
.banners{display:flex;gap:12px;overflow-x:auto;padding:10px 18px;scroll-snap-type:x mandatory;scrollbar-width:none}
.banners::-webkit-scrollbar{display:none}
.banner{flex:0 0 86%;scroll-snap-align:start;border-radius:var(--r);padding:18px;min-height:150px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--line)}
.banner h3{margin:0;font-size:24px;line-height:1.05;max-width:62%}
.banner .price{font-size:28px;font-weight:600}
.banner .old{text-decoration:line-through;opacity:.65;font-size:15px;margin-left:6px}
.banner p{margin:6px 0 0;font-size:13px;opacity:.85;max-width:62%}
.banner svg.art{position:absolute;right:-8px;bottom:-8px;width:46%;height:auto}
.banner svg.mk{position:absolute;right:-26px;top:-18px;width:44%;fill:currentColor;opacity:.14}
/* qidiruv, kategoriya */
.search{margin:8px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;align-items:center;gap:10px;padding:12px 14px}
.search input{border:0;outline:0;font-size:15px;width:100%;background:transparent}
.search input::placeholder,.f input::placeholder,.f textarea::placeholder{color:#6F6058}
.cats{display:flex;gap:8px;overflow-x:auto;padding:8px 18px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:10px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:14px;white-space:nowrap;color:var(--text)}
.cat.on{background:var(--peach);color:var(--peach-ink);border-color:var(--peach)}
h2.sec{margin:20px 18px 10px;font-size:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px}
.p{background:var(--card);border-radius:var(--r);padding:10px;border:1px solid var(--line);display:flex;flex-direction:column;text-align:left}
.p .img{aspect-ratio:1;border-radius:16px;overflow:hidden;position:relative;background:var(--card-2)}
.p .img svg{width:100%;height:100%;display:block}
.tag{position:absolute;left:8px;top:8px;background:var(--peach);color:var(--peach-ink);font-weight:700;font-size:11px;padding:4px 8px;border-radius:999px}
.p .name{font-weight:500;font-size:14px;margin:10px 2px 2px;line-height:1.25;min-height:35px}
.p .unit{font-size:12px;color:var(--muted);margin:0 2px}
.p .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.p .pr{font-weight:600;font-size:15px}
.p .pr s{display:block;font-size:11px;color:var(--muted);font-weight:400}
.add{width:36px;height:36px;border-radius:12px;background:var(--peach);color:var(--peach-ink);font-size:22px;font-weight:600;display:grid;place-items:center}
.stepper{display:flex;align-items:center;gap:6px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.stepper button{width:30px;height:30px;border-radius:10px;background:#2B231E;font-weight:600;font-size:17px}
.stepper span{min-width:18px;text-align:center;font-weight:600;font-size:14px}
.empty{padding:40px 24px;text-align:center;color:var(--muted);font-weight:500}
/* pastki menyu */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 28px);max-width:492px;z-index:20}
.nav .bar{background:rgba(22,18,15,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:999px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.nav .bar button{color:#8C7B73;font-size:11px;font-weight:500;padding:8px 2px;border-radius:999px;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.nav .bar button.on{background:var(--peach);color:var(--peach-ink)}
.badge{position:absolute;top:2px;right:18%;background:#E9AE86;color:var(--peach-ink);font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* oyna (sheet) */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;opacity:0;pointer-events:none;transition:.2s}
.veil.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:520px;background:#100C0A;border-top:1px solid var(--line);border-radius:28px 28px 0 0;z-index:31;max-height:92vh;overflow-y:auto;transition:transform .25s ease;padding:10px 18px 28px}
.sheet.show{transform:translate(-50%,0)}
.grab{width:44px;height:5px;border-radius:3px;background:#3A2F29;margin:4px auto 12px}
.sheet .big{border-radius:var(--r);overflow:hidden;aspect-ratio:16/11;background:var(--card-2)}
.sheet .big svg{width:100%;height:100%}
.sheet h3{font-size:30px;margin:14px 0 4px}
.sheet .desc{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 12px}
.buyrow{display:flex;gap:10px;align-items:center;margin-top:8px}
.buyrow .stepper{padding:6px}
.buyrow .stepper button{width:38px;height:38px}
.primary{flex:1;background:var(--peach);color:var(--peach-ink);font-weight:600;font-size:16px;padding:16px;border-radius:18px}
.primary:disabled{opacity:.4}
.with{margin-top:20px}
.with h4{margin:0 0 10px;font-size:15px;font-weight:600}
.mini{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.mini::-webkit-scrollbar{display:none}
.mini .m{flex:0 0 132px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;text-align:left}
.mini .m .i{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card-2)}
.mini .m .i svg{width:100%;height:100%}
.mini .m .n{font-size:12px;font-weight:500;margin:6px 2px 2px;line-height:1.2;min-height:29px}
.mini .m .r{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin:4px 2px 0}
.mini .m .r .add{width:28px;height:28px;font-size:18px;border-radius:9px}
/* sahifalar */
.page{padding:6px 18px}
.page h1{font-size:34px;margin:18px 0 12px}
.page h1,h2.sec,.sheet h3,.banner h3,.done h1{font-family:var(--serif);font-weight:700;letter-spacing:0}
.line{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:10px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.line .i{width:64px;height:64px;border-radius:14px;overflow:hidden;flex:0 0 auto;background:var(--card-2)}
.line .i svg{width:100%;height:100%}
.line .t{flex:1;min-width:0}
.line .t b{display:block;font-size:14px;line-height:1.25;font-weight:500}
.line .t small{color:var(--muted)}
.progress{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:6px 0 12px}
.progress p{margin:0 0 8px;font-size:13px;font-weight:500}
.track{height:8px;background:#2B231E;border-radius:4px;overflow:hidden}
.track i{display:block;height:100%;background:linear-gradient(90deg,#B9785A,var(--peach));border-radius:4px}
.sum{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0}
.sum div{display:flex;justify-content:space-between;font-size:14px;padding:5px 0}
.sum div.tot{font-size:18px;font-weight:600;border-top:1px dashed #3A2F29;margin-top:6px;padding-top:10px}
.sum .g{color:var(--ok)}
.f{margin-bottom:14px}
.f label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:0 0 6px 4px}
.f input,.f textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:14px;font-size:15px;outline:0}
.f input:focus,.f textarea:focus{border-color:var(--peach)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:11px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:500;font-size:14px}
.chips button.on{border-color:var(--peach);background:#1F1712;color:var(--peach)}
.err{color:var(--err);font-size:13px;font-weight:500;margin:4px 4px 10px;min-height:1px}
.order{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.order .h{display:flex;justify-content:space-between;align-items:center}
.order .h b{font-size:16px;font-weight:600}
.st{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(250,207,174,.12);color:var(--peach)}
.order p{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.done{text-align:center;padding:40px 10px}
.done .ok{width:84px;height:84px;border-radius:50%;background:var(--peach);display:grid;place-items:center;margin:0 auto 16px}
.done .ok svg{stroke:var(--peach-ink)}
.done h1{margin:0 0 8px;font-size:34px}
.done p{color:var(--muted);line-height:1.5}
.profile-card{background:linear-gradient(140deg,#FACFAE,#E3A47C);color:var(--peach-ink);border-radius:var(--r);padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.profile-card svg{position:absolute;right:-30px;top:-20px;width:150px;fill:var(--peach-ink);opacity:.1}
.profile-card .b{font-size:32px;font-weight:600;margin-top:6px}
.profile-card small{opacity:.75}
.info{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 14px;margin-bottom:12px}
.info div{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;display:flex;justify-content:space-between;gap:10px}
.info div:last-child{border:0}
.info span{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--peach);color:var(--peach-ink);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.2s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* QR tugma (menyu markazida) */
.nav .bar{grid-template-columns:1fr 1fr 76px 1fr 1fr !important;align-items:center}
.nav .bar .qr-btn{width:64px;height:64px;margin:-26px auto 0;border-radius:50%;background:var(--peach);color:var(--peach-ink);display:grid;place-items:center;padding:0;
box-shadow:0 0 0 6px var(--bg),0 8px 24px rgba(250,207,174,.25)}
.nav .bar .qr-btn.on{background:#fff}
.nav .bar .qr-btn svg{width:30px;height:30px}
/* QR sahifasi */
.qr-page{text-align:center}
.qr-card{background:#fff;border-radius:28px;padding:22px 22px 18px;margin:8px auto 0;max-width:340px;position:relative}
.qr-card .qr{width:100%;aspect-ratio:1;display:block;position:relative}
#qrBox svg{width:100%;height:100%;display:block}
.qr-card .cid{color:#1A120D;font-weight:600;letter-spacing:2px;font-size:15px;margin-top:10px}
.qr-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:16px;background:#1A120D;display:grid;place-items:center;box-shadow:0 0 0 5px #fff}
.qr-mark svg{width:36px;fill:var(--peach)}
.timer{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 4px;color:var(--muted);font-size:14px}
.timer svg{width:28px;height:28px;transform:rotate(-90deg)}
.timer b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}
.cb-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;margin:16px 0 12px;display:flex;justify-content:space-between;align-items:center;text-align:left}
.cb-card small{color:var(--muted);display:block;font-size:12px}
.cb-card b{font-size:24px;font-weight:600;color:var(--peach)}
.cb-card .pct{background:rgba(250,207,174,.12);color:var(--peach);font-weight:700;font-size:20px;border-radius:16px;padding:10px 14px}
.howto{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 16px;text-align:left}
.howto div{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
.howto div:last-child{border:0}
.howto i{font-style:normal;flex:0 0 26px;height:26px;border-radius:50%;background:var(--peach);color:var(--peach-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
</style>
</head>

function shortCode(id){ const d = id.replace(/\D/g,'').slice(-8).padStart(8,'0'); return 'MN-' + d.slice(0,4) + '-' + d.slice(4); }
function sig(str){ // FNV-1a — haqiqiy tizimda server imzosi bilan almashtiriladi
let h = 0x811c9dc5; for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
return h.toString(36).toUpperCase();
}
function qrPayload(){
const win = Math.floor(Date.now() / (CONFIG.qrRefreshSeconds*1000));
const id = customerId();
return { win, text: `MONAND|${id}|${win}|${sig(id+'|'+win+'|monand')}` };
}
let qrTimer = null, qrWin = null;
function renderQR(){
const sec = CONFIG.qrRefreshSeconds, id = customerId();
$('v-qr').innerHTML = `<h1>Mening QR kodim</h1>
<div class="qr-card"><div class="qr"><div id="qrBox" style="width:100%;height:100%"></div>
<div class="qr-mark"><svg viewBox="345 228 386 442">${MONAND_MARK}</svg></div></div>
<div class="cid">${shortCode(id)}</div></div>
<div class="timer"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#2A221D" stroke-width="4"/>
<circle id="qrRing" cx="18" cy="18" r="15" fill="none" stroke="#FACFAE" stroke-width="4" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="0"/></svg>
<span>Yangilanadi: <b id="qrLeft">${sec}</b> soniyadan keyin</span></div>
<div class="cb-card"><div><small>Cashback hisobingiz</small><b>${fmt(bonus)}</b></div><div class="pct">${CONFIG.storeCashbackPercent}%</div></div>
<div class="howto">
<div><i>1</i><span>Do'konimizda xarid qiling</span></div>
<div><i>2</i><span>To'lovdan keyin shu QR kodni kassirga ko'rsating</span></div>
<div><i>3</i><span>Xarid summasining <b style="color:var(--peach)">${CONFIG.storeCashbackPercent}%</b> i hisobingizga tushadi — keyingi xariddan to'laysiz</span></div>
</div>
<p style="color:var(--muted);font-size:12px;margin:14px 6px 0">QR har ${sec} soniyada o'zgaradi — skrinshot qilingan kod ishlamaydi.</p>`;
qrWin = null; tickQR();
if (qrTimer) clearInterval(qrTimer);
qrTimer = setInterval(tickQR, 1000);
}
function tickQR(){
if (view!=='qr' || !$('qrBox')) return;
const sec = CONFIG.qrRefreshSeconds, nowS = Date.now()/1000;
const left = Math.ceil(sec - (nowS % sec));
const p = qrPayload();
if (p.win !== qrWin){
qrWin = p.win;
const q = qrcode(0, 'H'); q.addData(p.text); q.make();
$('qrBox').innerHTML = q.createSvgTag({cellSize:8, margin:0, scalable:true});
if (qrWin !== null) haptic('light');
}
$('qrLeft').textContent = left;
$('qrRing').setAttribute('stroke-dashoffset', (94.2 * (1 - left/sec)).toFixed(1));
}
/* =========================================================
NAVIGATSIYA
========================================================= */
function go(v){
view = v; closeSheet();
if (v!=='qr' && qrTimer){ clearInterval(qrTimer); qrTimer=null; }
['home','cart','checkout','orders','profile','done','qr'].forEach(x=>$('v-'+x).classList.toggle('hide', x!==v));
refresh(); window.scrollTo(0,0);
if (tg && tg.BackButton){ try { v==='home' ? tg.BackButton.hide() : tg.BackButton.show(); } catch(e){} }
}
function render(){
if (view==='home'){ renderMode(); renderGrid(); }
if (view==='cart') renderCart();
if (view==='checkout') renderCheckout();
if (view==='orders') renderOrders();
if (view==='profile') renderProfile();
if (view==='done') renderDone();
if (view==='qr') renderQR();
}
function refresh(){
const n = cartCount(); const b=$('cartBadge'); b.textContent=n; b.classList.toggle('hide', !n);
$('bonusTop').textContent = Math.round(bonus).toLocaleString('ru-RU').replace(/,/g,' ');
document.querySelectorAll('.nav .bar button').forEach(btn=>btn.classList.toggle('on', btn.dataset.v===(['checkout','done'].includes(view)?'cart':view==='profile'?'orders':view)));
render();
if (openId) renderSheet(byId(openId));
}
if (tg && tg.BackButton){ try { tg.BackButton.onClick(()=> go(view==='checkout'?'cart':'home')); } catch(e){} }
renderBanners(); renderCats(); go('home'); refresh();
</script>
</body>
</html>
